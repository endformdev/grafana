name: End-to-end tests

on:
  pull_request:
  push:
    branches:
      - main
      - release-*.*.*

# TODO: re-enable this before merging
# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions: {}

env:
  ACTIONS_STEP_DEBUG: true
  RUNNER_DEBUG: 1

jobs:
  run-playwright-tests:
    name: Playwright E2E tests (${{ matrix.shard }}/${{ matrix.shardTotal }})
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        shard: [1]
        shardTotal: [2]

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            .yarn/cache
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile

      - name: Build app
        run: |
          yarn build

      - name: Build test plugins
        run: |
          yarn e2e:plugin:build

      - name: Start Grafana server
        run: |
          make run > grafana-server.log 2>&1 &
          GRAFANA_PID=$!
          echo "GRAFANA_PID=$GRAFANA_PID" >> $GITHUB_ENV

          # Wait for Grafana to be ready
          timeout 180 bash -c 'until curl -f http://localhost:3000/api/health; do sleep 2; done'

      - name: Run E2E tests
        run: |
          export CI=true
          export PLAYWRIGHT_HTML_OPEN=never
          export PLAYWRIGHT_BLOB_OUTPUT_DIR=./blob-report
          export ENDFORM_API_KEY=${{ secrets.ENDFORM_API_KEY }}

          yarn e2e:playwright --shard=${{ matrix.shard }}/${{ matrix.shardTotal }}

      - name: Stop Grafana server
        if: always()
        run: |
          if [ -n "$GRAFANA_PID" ]; then
            kill $GRAFANA_PID || true
          fi

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs-${{ matrix.shard }}
          path: |
            grafana-server.log
            playwright-webserver.log
